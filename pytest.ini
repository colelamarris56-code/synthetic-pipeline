# pytest configuration file
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add verbose output and show local variables on failure
addopts = -v --showlocals

# Environment variables for testing
env =
    DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_synthetic
    TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_synthetic